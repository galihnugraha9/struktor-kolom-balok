<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BIM 3D AR - Struktur Kolom & Balok (Skala 1:1)</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background-color: #18181b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    model-viewer {
      width: 100vw;
      height: 100vh;
      --poster-color: #18181b;
    }
    /* Indikator loading agar proses unduh model terlihat jelas */
    .progress-bar {
      display: block;
      width: 60%;
      max-width: 320px;
      height: 8px;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      border-radius: 10px;
      background-color: rgba(255, 255, 255, 0.2);
      overflow: hidden;
    }
    .progress-bar.hide {
      visibility: hidden;
      transition: visibility 0.3s;
    }
    .update-bar {
      background-color: #007bff;
      width: 0%;
      height: 100%;
      border-radius: 10px;
      transition: width 0.2s;
    }
    /* Label status di bagian atas */
    .badge-info {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.65);
      color: #e4e4e7;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      pointer-events: none;
      white-space: nowrap;
      border: 1px solid rgba(255, 255, 255, 0.15);
      z-index: 10;
    }
    /* Tombol Proyeksikan AR */
    #ar-button {
      background-color: #007bff;
      color: #ffffff;
      border: none;
      border-radius: 50px;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 600;
      position: absolute;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      box-shadow: 0 4px 14px rgba(0, 123, 255, 0.45);
      cursor: pointer;
      white-space: nowrap;
      z-index: 10;
    }
    #ar-button:active {
      transform: translateX(-50%) scale(0.97);
    }
  </style>
</head>
<body>

  <div class="badge-info">Mode BIM AR • Skala Terkunci 1:1</div>

  <model-viewer 
    id="bim-viewer"
    src="struktur.glb?v=2" 
    ar 
    ar-modes="webxr scene-viewer quick-look" 
    ar-scale="fixed" 
    camera-controls 
    touch-action="pan-y"
    shadow-intensity="1" 
    exposure="1"
    alt="Model BIM 3D Struktur Kolom Balok">

    <div class="progress-bar" slot="progress-bar">
      <div class="update-bar"></div>
    </div>

    <button slot="ar-button" id="ar-button">
      Proyeksikan AR (Skala 1:1)
    </button>
  </model-viewer>

  <script>
    const modelViewer = document.querySelector('#bim-viewer');
    const progressBar = document.querySelector('.progress-bar');
    const updateBar = document.querySelector('.update-bar');

    modelViewer.addEventListener('progress', (event) => {
      const progress = event.detail.totalProgress * 100;
      updateBar.style.width = `${progress}%`;
      if (progress === 100) {
        progressBar.classList.add('hide');
      }
    });
  </script>

</body>
</html>
